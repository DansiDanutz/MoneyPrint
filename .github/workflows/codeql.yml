name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v3
        with:
          category: /language:python
          output: ../results

      - name: Test the SARIF verifier
        run: node --test test/codeql-sarif-verifier.test.mjs

      - name: Require no unaccepted CodeQL findings in the pull request
        if: github.event_name == 'pull_request'
        run: node scripts/verify-codeql-sarif.mjs ../results

      - name: Require the exact reviewed full-tree CodeQL result set
        if: github.event_name != 'pull_request'
        run: node scripts/verify-codeql-sarif.mjs ../results --require-all
